name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  xcode-build:
    name: Xcode build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project VolDeck.xcodeproj

      - name: Build VolDeck
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -scheme VolDeck \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
