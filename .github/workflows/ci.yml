name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  xcode-build:
    name: Xcode build
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List project schemes
        run: xcodebuild -list -project VolDeck.xcodeproj

      - name: Run source hygiene checks
        run: sh scripts/check_source_hygiene.sh

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Run SwiftLint hygiene rules
        run: sh scripts/run_swiftlint.sh

      - name: Run HAL safety guard
        run: sh scripts/check_hal_safety.sh

      - name: Build VolDeck
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -scheme VolDeck \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze VolDeck
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -scheme VolDeck \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Run app recovery behavior tests
        run: sh scripts/run_app_recovery_behavior_tests.sh

      - name: Run session identity behavior tests
        run: sh scripts/run_session_identity_behavior_tests.sh

      - name: Build VolDeckOutputHelper
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -target VolDeckOutputHelper \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze VolDeckOutputHelper
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -target VolDeckOutputHelper \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Build VolDeckHALPlugin
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -target VolDeckHALPlugin \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Analyze VolDeckHALPlugin
        run: |
          xcodebuild \
            -quiet \
            -project VolDeck.xcodeproj \
            -target VolDeckHALPlugin \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            analyze

      - name: Run HAL contract tests
        run: sh scripts/run_hal_contract_tests.sh

      - name: Run audio bridge tests
        run: sh scripts/run_audio_bridge_tests.sh

      - name: Run output helper lifecycle tests
        run: sh scripts/run_output_helper_lifecycle_tests.sh
